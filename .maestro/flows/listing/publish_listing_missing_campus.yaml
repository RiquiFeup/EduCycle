appId: host.exp.exponent

---

- launchApp:
    clearState: true
- openLink: exp://10.0.2.2:8081

- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- tapOn:
    point: "50%, 10%"

- extendedWaitUntil:
    visible:
      id: "new-listing-screen"
    timeout: 60000

- waitForAnimationToEnd

- tapOn:
    id: "photo-upload-area"

- tapOn:
    id: "input-title"
- inputText: "Fisica 11o Ano - Resnick"

- hideKeyboard

- scrollUntilVisible:
    element:
      id: "subject-option-Physics"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "subject-option-Physics"

- scrollUntilVisible:
    element:
      id: "condition-option-Good"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "condition-option-Good"


- scrollUntilVisible:
    element:
      id: "input-price"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "input-price"
- inputText: "8"

- pressKey: Back

- scrollUntilVisible:
    element:
      id: "btn-publish"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "btn-publish"

- waitForAnimationToEnd


- assertVisible:
    id: "error-campus"

- assertNotVisible:
    text: ".*Listing published successfully.*"