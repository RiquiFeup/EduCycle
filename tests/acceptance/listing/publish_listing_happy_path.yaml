appId: host.exp.exponent

---
- launchApp:
    clearState: true

- openLink: exp://10.0.2.2:8081

- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

- tapOn:
    point: "50%, 10%"

- extendedWaitUntil:
    visible:
      id: "new-listing-screen"
    timeout: 60000

- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "photo-upload-area"
    direction: UP
    timeout: 10000

- tapOn:
    id: "photo-upload-area"
- assertVisible:
    id: "photo-upload-added-0"

- tapOn:
    id: "input-title"
- inputText: "Advanced Physics Textbook"

- hideKeyboard

# --- Subject Dropdown Interaction ---
- scrollUntilVisible:
    element:
      id: "dropdown-header-subject"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "dropdown-header-subject"
- scrollUntilVisible:
    element:
      id: "subject-option-Physics"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "subject-option-Physics"

# --- Condition Dropdown Interaction ---
- scrollUntilVisible:
    element:
      id: "dropdown-header-condition"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "dropdown-header-condition"
- scrollUntilVisible:
    element:
      id: "condition-option-Good"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "condition-option-Good"

# --- Campus Dropdown Interaction ---
- scrollUntilVisible:
    element:
      id: "dropdown-header-campus"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "dropdown-header-campus"
- scrollUntilVisible:
    element:
      id: "campus-option-FEUP"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "campus-option-FEUP"

- scrollUntilVisible:
    element:
      id: "input-isbn"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "input-isbn"
- inputText: "978-1234567890"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "input-price"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "input-price"
- inputText: "25"

- pressKey: Back

- scrollUntilVisible:
    element:
      id: "btn-publish"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "btn-publish"

- waitForAnimationToEnd

- scroll

- scrollUntilVisible:
    element:
      text: ".*Listing published successfully.*"
    direction: DOWN
    timeout: 30000

- assertVisible:
    text: ".*Listing published successfully.*"